name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint and format (Biome)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify generated documentation
        run: |
          npm run docs
          git diff --exit-code -- docs/TOOLS.md

      - name: Validate skills
        run: npm run skills:check

      - name: Verify committed plugin bundles match the source
        run: |
          npm run bundle:plugin
          git diff --exit-code -- bundle/

      - name: Smoke-test the plugin bundles without node_modules
        run: |
          mkdir -p /tmp/bundle-smoke
          cp bundle/kie-mcp.mjs bundle/kie-cli.mjs /tmp/bundle-smoke/
          cd /tmp/bundle-smoke
          node kie-cli.mjs --help > /dev/null
          KIE_AI_API_KEY=ci-not-a-real-key KIE_AI_DB_PATH=/tmp/bundle-smoke/tasks.db node kie-cli.mjs list_models --filter veo --json | grep -q veo3_generate_video

      - name: Verify what each package would publish
        run: npm run pack:check

      - name: Verify patch formatting
        run: git diff --check
