name: Release (npm publish with provenance)

# Publishes all public packages to npm with provenance and to GitHub Packages.
# The private @kie-ai-tool/core is never published; it is bundled into each
# public package by the prepack step.
#
# Trigger: push a version tag (e.g. `git tag v4.0.0 && git push origin v4.0.0`)
# or run manually from the Actions tab. Each package is published only if its
# current package.json version isn't already in the target registry, so re-runs
# are safe.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Build, typecheck, test
        run: |
          npm run build
          npm run typecheck
          npm test

      - name: Publish @kie-ai-tool/openai-server
        run: |
          VER=$(node -p "require('./packages/openai/package.json').version")
          if npm view "@kie-ai-tool/openai-server@$VER" version >/dev/null 2>&1; then
            echo "@kie-ai-tool/openai-server@$VER already published, skipping."
          else
            npm publish -w @kie-ai-tool/openai-server --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kie-ai-tool/mcp
        run: |
          VER=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "@kie-ai-tool/mcp@$VER" version >/dev/null 2>&1; then
            echo "@kie-ai-tool/mcp@$VER already published, skipping."
          else
            npm publish -w @kie-ai-tool/mcp --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kie-ai-tool/cli
        run: |
          VER=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@kie-ai-tool/cli@$VER" version >/dev/null 2>&1; then
            echo "@kie-ai-tool/cli@$VER already published, skipping."
          else
            npm publish -w @kie-ai-tool/cli --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kie-ai-tool/openai-server to GitHub Packages
        run: |
          npm config set @kie-ai-tool:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          VER=$(node -p "require('./packages/openai/package.json').version")
          if npm view "@kie-ai-tool/openai-server@$VER" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@kie-ai-tool/openai-server@$VER already published to GitHub Packages, skipping."
          else
            npm publish -w @kie-ai-tool/openai-server --registry=https://npm.pkg.github.com --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Publish @kie-ai-tool/mcp to GitHub Packages
        run: |
          npm config set @kie-ai-tool:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          VER=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "@kie-ai-tool/mcp@$VER" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@kie-ai-tool/mcp@$VER already published to GitHub Packages, skipping."
          else
            npm publish -w @kie-ai-tool/mcp --registry=https://npm.pkg.github.com --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Publish @kie-ai-tool/cli to GitHub Packages
        run: |
          npm config set @kie-ai-tool:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          VER=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@kie-ai-tool/cli@$VER" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@kie-ai-tool/cli@$VER already published to GitHub Packages, skipping."
          else
            npm publish -w @kie-ai-tool/cli --registry=https://npm.pkg.github.com --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
