name: Release (npm, trusted publishing)

# Publishes @kie-ai-tool/mcp, @kie-ai-tool/cli and @kie-ai-tool/openai-server
# to npm with provenance, using npm trusted publishing (OIDC): no npm token is
# stored anywhere. Each package must already exist on npm and list this repo
# and this workflow file (release.yml) as its trusted publisher; the first
# publish is done once by hand with scripts/first-publish.sh.
#
# Trigger: push a tag like v0.2.0 (after bumping the package versions), or run
# it from the Actions tab. A version that is already on npm is skipped, so
# re-runs are safe. @kie-ai-tool/core is private and bundled into the others.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Build, typecheck, test
        run: |
          npm run build
          npm run typecheck
          npm test

      - name: Publish packages
        run: |
          for pkg in mcp:@kie-ai-tool/mcp cli:@kie-ai-tool/cli openai:@kie-ai-tool/openai-server; do
            dir="${pkg%%:*}"
            name="${pkg#*:}"
            ver=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver is already on npm, skipping."
            else
              npm publish -w "$name" --provenance --access public
            fi
          done
